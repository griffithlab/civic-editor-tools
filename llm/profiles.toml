# Named LLM provider profiles for the llm package.
#
# This file holds no secrets - API keys are read only from the user's *.civic.conf file (the
# setting named by api_key_config) or, failing that, from the environment variable named by
# api_key_env. It's safe to commit and edit directly.
#
# Add a new profile by adding a new [name] table below with: provider ("anthropic",
# "openai_compatible" or "entra_gateway"), model (the default - callers can override it, e.g.
# review_evidence_items.py --llm-model), base_url (openai_compatible/entra_gateway only),
# api_key_config and/or api_key_env, supports (a list drawn from "structured_output", "tools",
# "large_context"), an optional [name.default_params] table of extra keyword args passed to
# the underlying client (e.g. max_tokens), and an optional [name.pricing] table of per-model
# token prices for cost estimates (entra_gateway profiles get prices from discovery instead).
#
# entra_gateway profiles also need token_url and scope (for the Microsoft Entra client-credentials
# bearer token), and optionally discovery_url. The request format for each
# model (OpenAI chat completions, Anthropic messages, or Gemini generateContent) is chosen from its api_format in the
# discovery response. Their client id, client secret and gateway API key always come from the
# llm_gateway_* settings in the user's *.civic.conf file.

[claude]
provider = "anthropic"
model = "claude-opus-5"  # verify/update against current docs as models change
api_key_config = "anthropic_api_key"
api_key_env = "ANTHROPIC_API_KEY"
supports = ["structured_output", "tools", "large_context"]
[claude.default_params]
max_tokens = 4096
[claude.pricing]
# USD per million tokens, used only for the cost estimate shown after each LLM-assisted review.
# Anthropic's models API doesn't return prices, so keep this in sync with the pricing page by
# hand. cache_write is the 5-minute TTL rate (what AnthropicClient's system-prompt cache uses).
# A model missing from this table just shows "cost unknown".
source = "https://platform.claude.com/docs/en/about-claude/pricing (checked 2026-10-22)"
"claude-fable-5-1" = { input = 10.00, output = 50.00, cache_write = 12.50, cache_read = 0.25 }
"claude-fable-5" = { input = 10.00, output = 50.00, cache_write = 12.50, cache_read = 1.00 }
"claude-opus-5-5" = { input = 4.00, output = 20.00, cache_write = 5.00, cache_read = 0.20 }
"claude-opus-5" = { input = 5.00, output = 25.00, cache_write = 6.25, cache_read = 0.50 }
"claude-opus-4-8" = { input = 5.00, output = 25.00, cache_write = 6.25, cache_read = 0.50 }
"claude-opus-4-7" = { input = 5.00, output = 25.00, cache_write = 6.25, cache_read = 0.50 }
"claude-opus-4-6" = { input = 5.00, output = 25.00, cache_write = 6.25, cache_read = 0.50 }
"claude-sonnet-5-5" = { input = 2.00, output = 10.00, cache_write = 2.50, cache_read = 0.10 }
"claude-sonnet-5" = { input = 2.00, output = 10.00, cache_write = 2.50, cache_read = 0.20 }
"claude-sonnet-4-6" = { input = 3.00, output = 15.00, cache_write = 3.75, cache_read = 0.30 }
# Haiku 5.5 rates are for prompts up to 100K tokens (review prompts are ~6K); longer prompts
# are billed at 5x these rates
"claude-haiku-5-5" = { input = 0.10, output = 0.50, cache_write = 0.125, cache_read = 0.01 }
"claude-haiku-4-5" = { input = 1.00, output = 5.00, cache_write = 1.25, cache_read = 0.10 }

[openai]
provider = "openai_compatible"
model = "gpt-4o"  # placeholder - verify/update against current docs as models change
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
supports = ["structured_output", "tools", "large_context"]
[openai.default_params]
max_tokens = 4096

[local]
provider = "openai_compatible"
model = "llama3.1"
base_url = "http://localhost:11434/v1"
api_key_env = ""  # no env var read; a harmless placeholder key is sent to the local server
# deliberately omits "structured_output": most local models don't reliably honor strict
# json_schema mode, so this profile exercises both the requires/supports warning and the
# OpenAICompatibleClient's JSON-mode fallback path
supports = ["tools"]
[local.default_params]
max_tokens = 4096

[wustl]
# WashU AI API gateway - many models behind one OpenAI-compatible endpoint, with centralized
# billing. Each model must be requested/enabled in the gateway dashboard before use; list the
# ones currently available to you with: python -m llm discover --profile wustl --civic-config <file>
provider = "entra_gateway"
model = "gpt-5.4-mini"
# OpenAI-format models are served at <base_url>/chat/completions, Anthropic-format (claude-*)
# models at <base_url>/messages, Gemini-format (gemini-*) models at <base_url>/generateContent
base_url = "https://aiapi.wustl.edu/models/v2"
token_url = "https://login.microsoftonline.com/4ccca3b5-71cd-4e6d-974b-4d9beb96c6d6/oauth2/v2.0/token"
scope = "api://bbeee386-60d6-4ba4-b9a7-631763f66065/.default"
discovery_url = "https://aiapi.wustl.edu/discovery/v1/getConfiguration"
# listed so the task's structured_output requirement doesn't warn on every run - not every model
# behind the gateway may honor strict JSON schema mode, but the client falls back to JSON mode
# automatically when the server rejects it
supports = ["structured_output", "large_context"]
[wustl.default_params]
# generous because newer OpenAI models count hidden reasoning tokens against this limit (sent to
# them as max_completion_tokens); it's a ceiling, not a charge - only tokens actually used are billed
max_tokens = 16384
